[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "efficient-tokenizer"
version = "2.0.0"
description = "Drop-in LLM proxy with multi-stage token compression, entity graph memory, and full observability."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Efficient Tokenizer Contributors" }
]
keywords = ["llm", "openai", "token", "compression", "proxy", "middleware"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.0",
  "pydantic==2.7.4",
  "tiktoken==0.7.0",
  "httpx==0.27.0",
]

[project.optional-dependencies]
redis   = ["redis==5.0.4"]
embed   = ["sentence-transformers>=3.0.0"]
all     = ["redis==5.0.4", "sentence-transformers>=3.0.0"]

[project.scripts]
efficient-tokenizer = "app.cli:main"

[project.urls]
Homepage   = "https://github.com/ldsryush/Effecient-Tokenizer"
Repository = "https://github.com/ldsryush/Effecient-Tokenizer"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
